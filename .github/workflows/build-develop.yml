name: Build

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: alterioncorp/.github/.github/actions/maven-settings@main

      - name: Build and Test
        run: mvn clean package

      - name: Save coverage report (logging-filter)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: logging-filter/target/site/jacoco/jacoco.xml
          retention-days: 1

      - name: Save coverage report (logging-filter-vertx)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-vertx
          path: logging-filter-vertx/target/site/jacoco/jacoco.xml
          retention-days: 1

  upload-coverage:
    needs: build
    uses: alterioncorp/.github/.github/workflows/upload-coverage.yml@main
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  upload-coverage-vertx:
    needs: build
    uses: alterioncorp/.github/.github/workflows/upload-coverage.yml@main
    with:
      artifact-name: jacoco-report-vertx
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
